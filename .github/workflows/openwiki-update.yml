name: OpenWiki Update

on:
  workflow_dispatch:
  schedule:
    # 3am US Eastern (EDT, UTC-4) every other day. GitHub cron is fixed UTC -
    # doesn't shift for DST, so this drifts to 2am once EST (UTC-5) kicks in.
    - cron: "0 7 */2 * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install OpenWiki
        # Pinned: unpinned, a scheduled run silently picks up a new OpenWiki and
        # its output format changes, so a tool upgrade arrives disguised as a
        # docs PR (0.2.2 dropped the sub-index frontmatter this way). Bump
        # deliberately.
        run: npm install --global openwiki@0.2.2

      - name: Run OpenWiki
        run: openwiki code --update --print
        env:
          OPENWIKI_PROVIDER: openai-compatible
          OPENAI_COMPATIBLE_BASE_URL: ${{ secrets.OPENWIKI_LLM_BASE_URL }}
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.OPENWIKI_LLM_API_KEY }}
          OPENWIKI_MODEL_ID: qwen3.6-35b

      - name: Create OpenWiki update pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # OpenWiki owns openwiki/ only. AGENTS.md/CLAUDE.md are hand-maintained
          # (they carry a single pointer into openwiki/) - keep the generator out.
          add-paths: |
            openwiki
          branch: openwiki/update
          commit-message: "docs: update OpenWiki"
          title: "docs: update OpenWiki"
          body: |
            Automated OpenWiki documentation update.

            This PR was generated by the scheduled OpenWiki workflow.
