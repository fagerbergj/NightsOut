apply plugin: 'com.android.application'

android {
    namespace 'com.wit.jasonfagerberg.nightsout'
    compileSdk 36
    defaultConfig {
        applicationId "com.wit.jasonfagerberg.nightsout"
        minSdkVersion 19
        targetSdkVersion 29
        versionCode 1904
        versionName "Rattata"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lint {
        // Play Store policy check; irrelevant until targetSdk is deliberately raised
        disable 'ExpiredTargetSdkVersion'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'com.google.android.material:material:1.1.0'
    implementation 'com.jjoe64:graphview:4.2.2'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    testImplementation 'junit:junit:4.12'
    implementation 'com.github.prolificinteractive:material-calendarview:2.0.1'
    // declared runtime-scoped by material-calendarview; needed on compile classpath for AndroidThreeTen.init
    implementation 'com.jakewharton.threetenabp:threetenabp:1.1.1'
    androidTestImplementation 'androidx.test:runner:1.2.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'
    implementation "androidx.preference:preference:1.1.1"
}
